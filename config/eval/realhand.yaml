# Evaluation paths for RealHand (JDM) (these values override eval_uncond.py CLI flags).
eval_batch_size: 4
img_size: 256
num_workers: 4
dataset_root: "/path/to/dataset"
save_root: "/path/to/results"
diffusion_pipeline_path: "/path/to/output/<realhand-jdm-run-id>"
counting_model_path: "/path/to/models/counting_model/realhand/model.pt"       # YOLO detector
quality_cls_model_path: "/path/to/models/quality_cls_model/realhand/model.pth"

# Hub alternatives (auth via `huggingface-cli login` or HF_TOKEN):
