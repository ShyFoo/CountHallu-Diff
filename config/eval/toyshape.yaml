# Evaluation paths for ToyShape (these values override eval_uncond.py CLI flags).
eval_batch_size: 128
img_size: 128
num_workers: 4
dataset_root: "/path/to/dataset"
save_root: "/path/to/results"
diffusion_pipeline_path: "/path/to/output/<toyshape-run-id>"
counting_model_path: "/path/to/models/counting_model/toyshape/model.pth"
quality_cls_model_path: null

