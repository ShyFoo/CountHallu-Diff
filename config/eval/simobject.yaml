# Evaluation paths for SimObject (these values override eval_uncond.py CLI flags).
eval_batch_size: 64
img_size: 256
num_workers: 4
dataset_root: "/path/to/dataset"
save_root: "/path/to/results"
diffusion_pipeline_path: "/path/to/output/<simobject-run-id>"
counting_model_path: "/path/to/models/counting_model/simobject/model.pth"
quality_cls_model_path: null

